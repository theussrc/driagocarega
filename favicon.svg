<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Fundo Squircle Preto / Grafite Clínico -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8" />

  <!-- Brilho Ambiente Folicular Ciano -->
  <circle cx="256" cy="256" r="160" fill="#0284c7" opacity="0.16" />

  <!-- Arco Folicular / Fio de Cabelo Estilizado (Precisão Capilar) -->
  <path d="M 256,70 C 370,160 385,310 280,395 C 235,430 170,420 145,370" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round" opacity="0.45" />

  <!-- Monograma IC (Dr. Iago Carega) de Alto Contraste para Favicon -->
  <!-- Letra I -->
  <circle cx="160" cy="130" r="25" fill="url(#cyanGrad)" />
  <line x1="160" y1="185" x2="160" y2="355" stroke="url(#silverGrad)" stroke-width="46" stroke-linecap="round" />

  <!-- Letra C -->
  <path d="M 355,190 C 315,160 260,170 232,205 C 205,240 205,295 232,332 C 260,368 315,378 355,348" 
        fill="none" stroke="url(#silverGrad)" stroke-width="46" stroke-linecap="round" />
</svg>
